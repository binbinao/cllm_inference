<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cllm · 本地对话</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link id="hljs-theme" rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
<style>
  /* ========================================================================
     设计系统 · Claude 风格温暖纯净
     - 深色基调：墨黑 (#1a1a1a) + 暖灰 (#2a2724) + 奶油强调 (#d4a574)
     - 浅色基调：米白 (#faf9f6) + 暖棕 (#8b6f47) + 墨色文字 (#2a2724)
     - 字体：系统默认 + Inter 回退，中文走系统栈
     ======================================================================== */
  :root[data-theme="dark"]{
    --bg:         #1a1a1a;
    --bg-elev:    #212020;
    --bg-input:   #2a2724;
    --bg-hover:   #2f2c28;
    --bg-active:  #3a3630;
    --border:     #333028;
    --border-soft:#2a2724;
    --fg:         #ebe4d9;
    --fg-soft:    #c4bcae;
    --fg-muted:   #8a8276;
    --accent:     #d4a574;
    --accent-fg:  #1a1a1a;
    --accent-soft:#5c4a35;
    --user-bg:    #2a3340;
    --user-fg:    #d6e4f0;
    --asst-bg:    transparent;
    --code-bg:    #16181d;
    --danger:     #e07a7a;
    --success:    #7ab87a;
    --shadow-sm:  0 1px 2px rgba(0,0,0,.3);
    --shadow-md:  0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:  0 16px 48px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:         #faf9f6;
    --bg-elev:    #ffffff;
    --bg-input:   #f3f1ec;
    --bg-hover:   #efede6;
    --bg-active:  #e7e3d9;
    --border:     #e4e0d4;
    --border-soft:#efede6;
    --fg:         #2a2724;
    --fg-soft:    #4a463f;
    --fg-muted:   #8a8276;
    --accent:     #8b6f47;
    --accent-fg:  #ffffff;
    --accent-soft:#efe4d4;
    --user-bg:    #e4ecf5;
    --user-fg:    #2a3340;
    --asst-bg:    transparent;
    --code-bg:    #f3f1ec;
    --danger:     #b84848;
    --success:    #3d8a3d;
    --shadow-sm:  0 1px 2px rgba(60,50,30,.06);
    --shadow-md:  0 4px 20px rgba(60,50,30,.08);
    --shadow-lg:  0 16px 48px rgba(60,50,30,.14);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                 "Inter", "Helvetica Neue", "PingFang SC",
                 "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 15px;
    line-height: 1.65;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- 布局骨架 ---------- */
  .app {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: 100vh;
    transition: grid-template-columns .25s ease;
  }
  .app[data-sidebar="collapsed"] { grid-template-columns: 0 1fr; }
  .app[data-sidebar="collapsed"] aside { transform: translateX(-100%); }

  /* ---------- 侧栏 ---------- */
  aside {
    background: var(--bg-elev);
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform .25s ease;
  }
  .brand {
    padding: 18px 20px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #000) 100%);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-fg);
    font-weight: 700;
    font-size: 14px;
    box-shadow: var(--shadow-sm);
  }
  .brand-text { flex: 1; min-width: 0; }
  .brand-text h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand-text small {
    display: block;
    color: var(--fg-muted);
    font-size: 11px;
    margin-top: 2px;
  }

  .side-section {
    padding: 14px 20px;
    border-top: 1px solid var(--border-soft);
  }
  .side-section:first-of-type { border-top: none; }
  .side-section h2 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--fg-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .status-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--bg-input);
    border-radius: 10px;
    border: 1px solid var(--border-soft);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--fg-muted);
    flex-shrink: 0;
    position: relative;
  }
  .status-dot.ok { background: var(--success); }
  .status-dot.ok::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: var(--success);
    opacity: 0.3;
    animation: pulse 2s ease-in-out infinite;
  }
  .status-dot.err { background: var(--danger); }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50%      { transform: scale(1.6); opacity: 0; }
  }
  .status-text { font-size: 13px; font-weight: 500; }
  .status-text small { display: block; color: var(--fg-muted); font-weight: 400; font-size: 11px; margin-top: 1px; }

  .model-info-grid {
    margin-top: 10px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 12px;
    font-size: 12px;
  }
  .model-info-grid span { color: var(--fg-muted); }
  .model-info-grid b { color: var(--fg-soft); font-weight: 500; }

  .side-scroll {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding: 14px 20px;
    border-top: 1px solid var(--border-soft);
  }
  .side-scroll::-webkit-scrollbar { width: 6px; }
  .side-scroll::-webkit-scrollbar-track { background: transparent; }
  .side-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .filter-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    padding: 3px;
    background: var(--bg-input);
    border-radius: 8px;
  }
  .filter-tabs button {
    flex: 1;
    padding: 5px 10px;
    font-size: 12px;
    background: transparent;
    color: var(--fg-muted);
    border: none;
    border-radius: 6px;
    transition: all .15s;
  }
  .filter-tabs button:hover { color: var(--fg-soft); }
  .filter-tabs button.active {
    background: var(--bg-elev);
    color: var(--fg);
    box-shadow: var(--shadow-sm);
  }

  .model-item {
    padding: 10px 12px;
    margin-bottom: 6px;
    background: var(--bg-input);
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .model-item:hover {
    background: var(--bg-hover);
    border-color: var(--border);
    transform: translateY(-1px);
  }
  .model-item.active {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, var(--bg-input));
  }
  .model-item .name {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .family-tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .family-tag.qwen { background: color-mix(in srgb, #6ea8ff 20%, transparent); color: #6ea8ff; }
  .family-tag.llama { background: color-mix(in srgb, #b592ff 20%, transparent); color: #b592ff; }
  .model-item .meta { font-size: 11px; color: var(--fg-muted); }

  /* ---------- 主区 ---------- */
  main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg);
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--bg-elev);
    min-height: 56px;
  }
  .icon-btn {
    width: 32px; height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--fg-soft);
    border: 1px solid transparent;
    border-radius: 8px;
    transition: all .15s;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--fg); }
  .icon-btn svg { width: 18px; height: 18px; }

  .topbar-title {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .topbar-title .model-name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-title .arch-badge {
    font-size: 11px;
    padding: 2px 8px;
    background: var(--bg-input);
    color: var(--fg-muted);
    border-radius: 10px;
    flex-shrink: 0;
  }

  /* ---------- 对话滚动区 ---------- */
  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .chat-scroll::-webkit-scrollbar { width: 8px; }
  .chat-scroll::-webkit-scrollbar-track { background: transparent; }
  .chat-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .chat-container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 24px 120px;
  }

  /* 首屏欢迎 */
  .welcome {
    text-align: center;
    padding: 60px 20px 20px;
  }
  .welcome h2 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .welcome p { color: var(--fg-muted); margin: 0 0 32px; }
  .suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    max-width: 580px;
    margin: 0 auto;
  }
  @media (max-width: 560px) {
    .suggestions { grid-template-columns: 1fr; }
  }
  .suggestion {
    padding: 14px 16px;
    background: var(--bg-elev);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    text-align: left;
    color: var(--fg-soft);
    font-size: 13px;
    transition: all .15s;
    cursor: pointer;
  }
  .suggestion:hover {
    border-color: var(--border);
    background: var(--bg-hover);
    transform: translateY(-1px);
  }
  .suggestion .title { color: var(--fg); font-weight: 500; margin-bottom: 2px; }
  .suggestion .hint { color: var(--fg-muted); font-size: 12px; }

  /* 消息 */
  .msg {
    margin-bottom: 24px;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    color: var(--fg-muted);
    font-size: 12px;
  }
  .msg-avatar {
    width: 24px; height: 24px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
  }
  .msg.user .msg-avatar {
    background: linear-gradient(135deg, #5a7ca8 0%, #3d5a7e 100%);
  }
  .msg.assistant .msg-avatar {
    background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 60%, #000) 100%);
    color: var(--accent-fg);
  }
  .msg-role { font-weight: 500; color: var(--fg-soft); }
  .msg-actions {
    margin-left: auto;
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity .15s;
  }
  .msg:hover .msg-actions { opacity: 1; }
  .msg-actions button {
    padding: 4px 8px;
    font-size: 11px;
    color: var(--fg-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    transition: all .15s;
  }
  .msg-actions button:hover {
    background: var(--bg-hover);
    color: var(--fg-soft);
  }

  .msg-content {
    padding-left: 34px;
    color: var(--fg);
    overflow-wrap: break-word;
    word-wrap: break-word;
  }
  .msg.user .msg-content {
    background: var(--user-bg);
    color: var(--user-fg);
    padding: 10px 14px;
    border-radius: 12px;
    margin-left: 34px;
    display: inline-block;
    max-width: calc(100% - 34px);
  }
  /* Markdown 内样式 */
  .msg-content p { margin: 0 0 10px; }
  .msg-content p:last-child { margin-bottom: 0; }
  .msg-content ul, .msg-content ol { margin: 0 0 10px; padding-left: 24px; }
  .msg-content li { margin-bottom: 3px; }
  .msg-content h1, .msg-content h2, .msg-content h3, .msg-content h4 {
    margin: 16px 0 8px; font-weight: 600; letter-spacing: -0.01em;
  }
  .msg-content h1 { font-size: 20px; }
  .msg-content h2 { font-size: 17px; }
  .msg-content h3 { font-size: 15px; }
  .msg-content blockquote {
    margin: 8px 0; padding: 2px 12px;
    border-left: 3px solid var(--border);
    color: var(--fg-soft);
  }
  .msg-content code:not(pre code) {
    background: var(--code-bg);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    border: 1px solid var(--border-soft);
  }
  .msg-content pre {
    background: var(--code-bg);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    margin: 10px 0;
    position: relative;
    overflow: hidden;
  }
  .code-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: color-mix(in srgb, var(--code-bg) 70%, var(--bg-elev));
    border-bottom: 1px solid var(--border-soft);
    font-size: 11px;
    color: var(--fg-muted);
  }
  .code-head button {
    padding: 3px 8px;
    background: transparent;
    color: var(--fg-muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 11px;
    transition: all .15s;
  }
  .code-head button:hover { color: var(--fg); border-color: var(--fg-muted); }
  .msg-content pre code {
    display: block;
    padding: 12px 14px;
    font-size: 12.5px;
    line-height: 1.6;
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    overflow-x: auto;
  }
  .msg-content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }
  .msg-content table {
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
  }
  .msg-content th, .msg-content td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .msg-content th { background: var(--bg-input); font-weight: 600; }

  /* 流式光标 */
  .typing-cursor::after {
    content: '▊';
    color: var(--accent);
    margin-left: 2px;
    animation: cursor-blink 1s steps(2) infinite;
    font-weight: 100;
  }
  @keyframes cursor-blink { 50% { opacity: 0; } }

  .error-chip {
    display: inline-block;
    margin-top: 8px;
    padding: 6px 10px;
    background: color-mix(in srgb, var(--danger) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
    border-radius: 8px;
    color: var(--danger);
    font-size: 12px;
  }

  /* ---------- 输入区 ---------- */
  .composer-wrap {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    padding: 20px 24px 16px;
  }
  .composer {
    max-width: 760px;
    margin: 0 auto;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 10px 10px 16px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    box-shadow: var(--shadow-md);
    transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within {
    border-color: var(--accent);
    box-shadow: var(--shadow-md), 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .composer textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    padding: 8px 0;
    font-size: 15px;
    line-height: 1.5;
    color: var(--fg);
    min-height: 24px;
    max-height: 200px;
  }
  .composer textarea::placeholder { color: var(--fg-muted); }
  .send-btn {
    width: 36px; height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 10px;
    transition: all .15s;
    flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: var(--shadow-sm);
  }
  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .send-btn.stop { background: var(--danger); }
  .send-btn svg { width: 18px; height: 18px; }

  .params-bar {
    max-width: 760px;
    margin: 10px auto 0;
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--fg-muted);
    flex-wrap: wrap;
    align-items: center;
  }
  .params-bar label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .params-bar input[type=number] {
    width: 58px;
    padding: 3px 6px;
    font-size: 12px;
    background: var(--bg-input);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    text-align: right;
  }
  .params-bar input[type=number]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .params-bar label.toggle {
    cursor: pointer;
    user-select: none;
  }
  .params-bar input[type=checkbox] {
    accent-color: var(--accent);
  }

  /* ---------- 模态框 ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn .2s ease;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 640px;
    width: 92%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px 28px;
    box-shadow: var(--shadow-lg);
    animation: modalIn .25s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes modalIn {
    from { transform: translateY(16px) scale(0.98); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  .modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .modal h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .modal .modal-sub { color: var(--fg-muted); font-size: 13px; margin-top: 4px; }
  .modal h4 {
    margin: 20px 0 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--fg-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .modal pre {
    background: var(--code-bg);
    border: 1px solid var(--border-soft);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 12.5px;
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    margin: 0;
    position: relative;
  }
  .modal pre button.copy {
    position: absolute;
    top: 8px;
    right: 8px;
    padding: 4px 10px;
    font-size: 11px;
    background: var(--bg-elev);
    color: var(--fg-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: all .15s;
  }
  .modal pre button.copy:hover { color: var(--fg); border-color: var(--accent); }
  .modal pre button.copy.copied { color: var(--success); border-color: var(--success); }
  .modal .hint { color: var(--fg-muted); font-size: 12px; margin-top: 14px; line-height: 1.6; }

  /* ---------- 响应式 ---------- */
  @media (max-width: 720px) {
    .app { grid-template-columns: 0 1fr; }
    aside { position: fixed; width: 280px; height: 100vh; z-index: 50; transform: translateX(-100%); }
    .app[data-sidebar="open"] aside { transform: translateX(0); }
    .app[data-sidebar="open"] { grid-template-columns: 0 1fr; }
    .app[data-sidebar="open"]::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 40;
    }
  }
</style>
</head>
<body>
<div class="app" id="app" data-sidebar="open">
  <!-- ============== 侧栏 ============== -->

      <div class="brand-icon">C</div>

  <!-- ============== 主区 ============== -->

      </div>
      <button class="icon-btn" id="btn-theme" title="切换主题">
        <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>

<!-- ============== 启动命令模态框 ============== -->

<!-- Markdown + 代码高亮（CDN，jsDelivr，可缓存） -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>

<script>
/* ============================================================
   cllm_inference 前端应用脚本
   ============================================================ */

const API_BASE = (location.origin && location.origin.startsWith("http"))
  ? location.origin : "http://127.0.0.1:8080";

const $ = (id) => document.getElementById(id);
const app = $("app");
const chatScroll = $("chat-scroll");
const chatContainer = $("chat-container");
// 注：welcome 元素会被 clearChat 重建，所以每次使用都通过 $("welcome") 动态查询

let currentModel = null;
let allModels = [];
let currentFilter = "all";
let messages = [];
let aborter = null;

/* ---------- Markdown 渲染 ---------- */
const md = (() => {
  if (typeof marked === "undefined") {
    return (text) => escapeHtml(text).replace(/\n/g, "<br>");
  }
  marked.setOptions({
    breaks: true,
    gfm: true,
    highlight: function (code, lang) {
      if (typeof hljs !== "undefined") {
        try {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
          }
          return hljs.highlightAuto(code).value;
        } catch (e) { return escapeHtml(code); }
      }
      return escapeHtml(code);
    }
  });
  return (text) => marked.parse(text);
})();

function renderMarkdown(container, text) {
  container.innerHTML = md(text);
  // 为所有 pre 块加上头部（语言 + 复制按钮）
  container.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".code-head")) return;
    const code = pre.querySelector("code");
    if (!code) return;
    const langMatch = code.className.match(/language-(\S+)/);
    const lang = langMatch ? langMatch[1] : "code";
    const head = document.createElement("div");
    head.className = "code-head";
    head.innerHTML = `<span>${escapeHtml(lang)}</span><button type="button">复制</button>`;
    const btn = head.querySelector("button");
    btn.addEventListener("click", () => {
      navigator.clipboard.writeText(code.textContent).then(() => {
        btn.textContent = "已复制";
        setTimeout(() => btn.textContent = "复制", 1200);
      }).catch(() => btn.textContent = "失败");
    });
    pre.insertBefore(head, code);
  });
}

/* ---------- 工具 ---------- */
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function formatSize(mb) {
  if (mb >= 1024) return (mb / 1024).toFixed(1) + " GB";
  return mb + " MB";
}
function scrollToBottom() {
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

/* ---------- 主题切换 ---------- */
function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("cllm_theme", theme);
  // 切换 highlight.js 主题
  const link = $("hljs-theme");
  link.href = theme === "dark"
    ? "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css"
    : "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-light.min.css";
  // 更新图标
  const btn = $("btn-theme");
  btn.innerHTML = theme === "dark"
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
         <circle cx="12" cy="12" r="4"/>
         <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
       </svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
         <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
       </svg>`;
}
setTheme(localStorage.getItem("cllm_theme") || "dark");
$("btn-theme").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  setTheme(now);
};

/* ---------- 侧栏折叠 ---------- */
$("btn-toggle-sidebar").onclick = () => {
  const now = app.dataset.sidebar;
  app.dataset.sidebar = (now === "collapsed") ? "open" : "collapsed";
};

/* ---------- 示例提问 ---------- */
const SUGGESTIONS = [
  { title: "介绍自己", hint: "简要说说你是什么模型", prompt: "简要介绍一下你自己：是什么模型、有什么特点。" },
  { title: "解释代码", hint: "逐行讲解一段 C++", prompt: "请解释下面这段 C++ 代码的作用：\n\n```cpp\nstd::vector<int> ids;\nfor (size_t i = 0; i + 1 < ids.size(); ++i) {\n    // ...\n}\n```" },
  { title: "翻译一段话", hint: "英 → 中，保持语气", prompt: "请把下面这段英文翻译成自然的中文：\n\n\"Attention is all you need\" is a seminal paper that introduced the Transformer architecture." },
  { title: "头脑风暴", hint: "给出几个产品点子", prompt: "请为一款面向开发者的本地 LLM 工具，提出 5 个有创意的新功能点子。" },
];
function renderSuggestions() {
  $("suggestions").innerHTML = SUGGESTIONS.map(s => `
    <button class="suggestion" data-prompt="${escapeHtml(s.prompt)}">
      <div class="title">${escapeHtml(s.title)}</div>
      <div class="hint">${escapeHtml(s.hint)}</div>
    </button>
  `).join("");
  $("suggestions").querySelectorAll(".suggestion").forEach(el => {
    el.onclick = () => {
      $("input").value = el.dataset.prompt;
      autoGrow($("input"));
      $("input").focus();
    };
  });
}
renderSuggestions();

/* ---------- 后端连接 ---------- */
async function fetchModelInfo() {
  $("status-dot").className = "status-dot";
  $("status-text").firstChild.textContent = "连接中… ";
  $("status-sub").textContent = "读取模型信息";
  try {
    const res = await fetch(API_BASE + "/v1/model/info");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const info = await res.json();
    currentModel = info;
    $("status-dot").className = "status-dot ok";
    $("status-text").firstChild.textContent = "已就绪 ";
    $("status-sub").textContent = info.id;
    $("model-info").style.display = "grid";
    $("mi-arch").textContent = info.architecture || "—";
    $("mi-shape").textContent = `${info.n_layers}L · ${info.n_embd}h`;
    $("mi-ctx").textContent = info.n_ctx.toLocaleString();
    $("mi-tpl").textContent = info.has_chat_template ? (info.chat_template_format || "yes") : "无";
    $("tb-model").textContent = info.id;
    $("tb-arch").textContent = info.architecture;
    $("tb-arch").style.display = "inline-block";
    highlightActiveModel();
  } catch (e) {
    $("status-dot").className = "status-dot err";
    $("status-text").firstChild.textContent = "后端未就绪 ";
    $("status-sub").textContent = "请启动 cllm_inference";
    $("tb-model").textContent = "未加载模型";
  }
}

/* ---------- 模型库 ---------- */
async function fetchModels() {
  try {
    const res = await fetch("models.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    allModels = data.models || [];
    renderModelList();
  } catch (e) {
    $("model-list").innerHTML =
      `<p style="color:var(--danger);font-size:12px;">清单加载失败：${escapeHtml(e.message)}<br>请通过 cllm_inference 的 HTTP 服务访问本页。</p>`;
  }
}
function renderModelList() {
  const items = allModels.filter(m => currentFilter === "all" || m.family === currentFilter);
  $("model-list").innerHTML = items.map(m => `
    <div class="model-item" data-id="${m.id}" data-file="${m.file}">
      <div class="name">
        ${escapeHtml(m.name)}
        <span class="family-tag ${m.family}">${m.family}</span>
      </div>
      <div class="meta">${m.params} · ${m.quant} · ${formatSize(m.size_mb)} · ctx ${m.ctx.toLocaleString()}</div>
    </div>
  `).join("");
  $("model-list").querySelectorAll(".model-item").forEach(el => {
    el.onclick = () => showLaunchCommand(el.dataset.id);
  });
  highlightActiveModel();
}
function highlightActiveModel() {
  if (!currentModel) return;
  $("model-list").querySelectorAll(".model-item").forEach(el => {
    el.classList.toggle("active", el.dataset.file === currentModel.id);
  });
}
document.querySelectorAll(".filter-tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter-tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    renderModelList();
  };
});

/* ---------- 启动命令模态框 ---------- */
function showLaunchCommand(id) {
  const m = allModels.find(x => x.id === id);
  if (!m) return;
  $("m-title").textContent = m.name;
  $("m-sub").textContent = `${m.params} 参数 · ${m.quant} · 磁盘 ${formatSize(m.size_mb)}`;
  $("m-download").textContent =
    `mkdir -p models\ncurl -L -o models/${m.file} \\\n  "${m.url}"`;
  $("m-launch").textContent =
    `./cllm_inference --model models/${m.file} --port 8080\n# 启动后浏览器刷新 http://127.0.0.1:8080/`;
  $("modal-bg").classList.add("open");
}
function closeModal() { $("modal-bg").classList.remove("open"); }
$("modal-bg").addEventListener("click", (e) => {
  if (e.target === $("modal-bg")) closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("modal-bg").classList.contains("open")) closeModal();
});
// 模态框内的复制按钮
document.querySelectorAll(".modal pre button.copy").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const target = $(btn.dataset.target);
    if (!target) return;
    navigator.clipboard.writeText(target.textContent).then(() => {
      btn.textContent = "已复制";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("copied"); }, 1200);
    });
  });
});

/* ---------- 消息渲染 ---------- */
function addMessage(role, content = "", loading = false) {
  const welcome = $("welcome");
  if (welcome) welcome.remove();

  const wrap = document.createElement("div");
  wrap.className = "msg " + role;

  const avatar = role === "user" ? "我" : "AI";
  const roleLabel = role === "user" ? "你" : "助手";

  wrap.innerHTML = `
    <div class="msg-header">
      <div class="msg-avatar">${avatar}</div>
      <div class="msg-role">${roleLabel}</div>
      <div class="msg-actions">
        <button data-act="copy" title="复制">复制</button>
        ${role === "assistant" ? '<button data-act="regen" title="重新生成">重新生成</button>' : ''}
      </div>
    </div>
    <div class="msg-content${loading ? ' typing-cursor' : ''}"></div>
  `;
  const contentEl = wrap.querySelector(".msg-content");
  if (role === "user") {
    contentEl.textContent = content;
  } else {
    renderMarkdown(contentEl, content);
  }
  // 消息级操作
  wrap.querySelectorAll(".msg-actions button").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.act === "copy") {
        const raw = wrap.dataset.raw || contentEl.textContent;
        navigator.clipboard.writeText(raw).then(() => {
          const orig = btn.textContent;
          btn.textContent = "已复制";
          setTimeout(() => btn.textContent = orig, 1200);
        });
      } else if (btn.dataset.act === "regen") {
        regenerateLast();
      }
    });
  });
  chatContainer.appendChild(wrap);
  scrollToBottom();
  return { wrap, contentEl };
}

function regenerateLast() {
  // 移除最后一条 assistant 消息，重新生成
  const lastAsst = chatContainer.querySelector(".msg.assistant:last-of-type");
  if (!lastAsst) return;
  if (messages.length && messages[messages.length - 1].role === "assistant") {
    messages.pop();
  }
  lastAsst.remove();
  if (messages.length && messages[messages.length - 1].role === "user") {
    const lastUserText = messages[messages.length - 1].content;
    // 不改 messages，直接走一次生成（messages 已含 user 消息）
    doGenerate();
  }
}

/* ---------- 生成 ---------- */
async function send() {
  const text = $("input").value.trim();
  if (!text || aborter) return;
  if (!currentModel) {
    alert("后端未就绪，请先启动 cllm_inference 服务");
    return;
  }
  $("input").value = "";
  autoGrow($("input"));
  addMessage("user", text);
  messages.push({ role: "user", content: text });
  doGenerate();
}

async function doGenerate() {
  const stream = $("p-stream").checked;
  const body = {
    model: currentModel.id,
    messages: messages,
    temperature: parseFloat($("p-temp").value),
    top_p: parseFloat($("p-topp").value),
    top_k: parseInt($("p-topk").value, 10),
    max_tokens: parseInt($("p-max").value, 10),
    stream: stream
  };

  const { wrap, contentEl } = addMessage("assistant", "", true);
  setGenerating(true);
  aborter = new AbortController();
  let acc = "";

  try {
    const res = await fetch(API_BASE + "/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: aborter.signal,
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    if (stream) {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      let rafScheduled = false;
      const scheduleRender = () => {
        if (rafScheduled) return;
        rafScheduled = true;
        requestAnimationFrame(() => {
          rafScheduled = false;
          renderMarkdown(contentEl, acc);
          contentEl.classList.add("typing-cursor");
          scrollToBottom();
        });
      };
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) !== -1) {
          const chunk = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          for (const line of chunk.split("\n")) {
            if (!line.startsWith("data:")) continue;
            const data = line.slice(5).trim();
            if (data === "[DONE]") continue;
            try {
              const obj = JSON.parse(data);
              const delta = obj.choices?.[0]?.delta?.content;
              if (delta) {
                acc += delta;
                scheduleRender();
              }
            } catch (_) { /* ignore */ }
          }
        }
      }
    } else {
      const obj = await res.json();
      acc = obj.choices?.[0]?.message?.content || obj.choices?.[0]?.text || "";
      renderMarkdown(contentEl, acc);
    }
    contentEl.classList.remove("typing-cursor");
    wrap.dataset.raw = acc;
    messages.push({ role: "assistant", content: acc });
  } catch (e) {
    contentEl.classList.remove("typing-cursor");
    if (e.name === "AbortError") {
      renderMarkdown(contentEl, acc + "\n\n*（已停止）*");
    } else {
      renderMarkdown(contentEl, acc);
      const chip = document.createElement("div");
      chip.className = "error-chip";
      chip.textContent = "错误：" + e.message;
      contentEl.appendChild(chip);
    }
  } finally {
    aborter = null;
    setGenerating(false);
    scrollToBottom();
  }
}

function setGenerating(on) {
  const btn = $("btn-send");
  if (on) {
    btn.classList.add("stop");
    btn.title = "停止";
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
  } else {
    btn.classList.remove("stop");
    btn.title = "发送";
    btn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>`;
  }
}

/* ---------- 清空对话 ---------- */
function clearChat() {
  if (aborter) { aborter.abort(); aborter = null; }
  messages = [];
  chatContainer.innerHTML = "";
  // 重新插入欢迎屏
  const w = document.createElement("div");
  w.className = "welcome";
  w.id = "welcome";
  w.innerHTML = `
    <h2>你好，开始对话吧</h2>
    <p>本地推理，隐私优先。流式响应，支持 Markdown 与代码高亮。</p>
    <div class="suggestions" id="suggestions"></div>
  `;
  chatContainer.appendChild(w);
  renderSuggestions();
  setGenerating(false);
}

/* ---------- 输入区交互 ---------- */
function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = Math.min(200, el.scrollHeight) + "px";
}
$("input").addEventListener("input", (e) => autoGrow(e.target));
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (aborter) { aborter.abort(); return; }
    send();
  }
});

/* ---------- 顶部按钮 ---------- */
$("btn-send").addEventListener("click", (e) => {
  e.preventDefault();
  if (aborter) { aborter.abort(); return; }
  send();
});
$("btn-refresh").onclick = () => { fetchModelInfo(); fetchModels(); };
$("btn-clear").onclick = () => {
  if (chatContainer.querySelector(".msg") && !confirm("清空当前对话？")) return;
  clearChat();
};

/* ---------- 初始化 ---------- */
fetchModelInfo();
fetchModels();
</script>
</body>
</html>
